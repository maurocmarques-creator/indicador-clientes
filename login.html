<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Indicador PortoEx</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{--primary:#1a3a5c;--primary-light:#2563a8;--border:#e2e8f0;--gray:#64748b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',sans-serif;background:var(--primary);min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:#fff;border-radius:12px;padding:36px 32px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  h1{font-size:1.3rem;color:var(--primary);margin-bottom:4px}
  .sub{font-size:.82rem;color:var(--gray);margin-bottom:24px}
  label{display:block;font-size:.8rem;font-weight:600;color:#334155;margin-bottom:5px}
  input{width:100%;border:1px solid var(--border);border-radius:7px;padding:9px 11px;font-size:.9rem;margin-bottom:16px}
  input:focus{outline:2px solid var(--primary-light);outline-offset:1px}
  button{width:100%;background:var(--primary);color:#fff;border:0;border-radius:8px;padding:11px;font-size:.92rem;font-weight:700;cursor:pointer}
  button:hover{filter:brightness(1.12)}
  button:disabled{opacity:.6;cursor:not-allowed}
  .erro{background:#fdecec;color:#b91c1c;border-radius:7px;padding:9px 11px;font-size:.82rem;margin-bottom:16px;display:none}
</style>
</head>
<body>

<div class="card">
  <h1>Indicador PortoEx</h1>
  <p class="sub">Entre com seu usuário e senha.</p>
  <div id="erro" class="erro"></div>
  <form id="form-login">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password" required>
    <button id="btn-entrar" type="submit">Entrar</button>
  </form>
</div>

<script>
const SUPABASE_URL = 'https://fydoatntynvcwudxkhqv.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_lXegUG6Ry1uZI3lqnbKyQg_lv-Ivzv6';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MENSAGENS_ERRO = {
  sem_perfil: 'Seu login existe, mas ainda não foi vinculado a um cliente. Fale com a PortoEx.',
  inativo: 'Seu acesso está desativado. Fale com a PortoEx.',
  sem_acesso: 'Este login não tem acesso a este sistema. Fale com a PortoEx.',
};

(function mostrarErroDaUrl(){
  const params = new URLSearchParams(location.search);
  const codigo = params.get('erro');
  if (codigo && MENSAGENS_ERRO[codigo]) {
    const el = document.getElementById('erro');
    el.textContent = MENSAGENS_ERRO[codigo];
    el.style.display = 'block';
  }
})();

// Se ja tiver sessao valida, nao mostra o login de novo.
(async function redirecionaSeJaLogado(){
  const { data: { session } } = await supabaseClient.auth.getSession();
  if (session) location.href = 'index.html';
})();

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const senha = document.getElementById('senha').value;
  const btn = document.getElementById('btn-entrar');
  const erroEl = document.getElementById('erro');
  erroEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Entrando…';

  const { error } = await supabaseClient.auth.signInWithPassword({ email, password: senha });

  if (error) {
    erroEl.textContent = 'E-mail ou senha incorretos.';
    erroEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Entrar';
    return;
  }

  location.href = 'index.html';
});
</script>

</body>
</html>
