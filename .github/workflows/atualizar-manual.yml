name: Atualizar Indicador Clientes (manual)

# Etapa 4 (01/10/2026): pipeline multi-cliente -- extrai todos os
# clientes ativos (cadastrados em admin.html) do portal Brudam e grava
# no Supabase (tabelas fretes/ocorrencias_historico), em vez de um
# index.html por cliente. Variaveis de ambiente necessarias na maquina
# do runner (self-hosted, persistentes no PC, nao em GitHub Secrets --
# mesmo padrao do indicador-ansell): PORTAL_USER, PORTAL_PASS,
# SUPABASE_SERVICE_ROLE_KEY, EMAIL_USER, EMAIL_PASS.

on:
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: self-hosted
    # Roda direto na pasta do projeto que ja existe no PC -- sem clonar
    # de novo, sem duplicar pipeline.lock/run_output.log/downloads_tmp.
    steps:
      - name: Rodar pipeline
        working-directory: C:\Users\Mauro Cesar Marques\OneDrive - PORTOEXPRESS LOGISTICA LTDA\Indicador Clientes Geral
        run: python pipeline_atualizar.py
        shell: cmd
